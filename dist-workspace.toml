[workspace.metadata.dist]
cargo-dist-version = "0.20.0"
ci = ["github"]
installers = ["shell", "homebrew"]
tap = "gitvault/homebrew-tap"
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
pr-run-mode = "plan"
publish-jobs = ["homebrew"]
